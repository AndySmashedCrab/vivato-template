name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          rm -f .pnp.cjs .pnp.loader.mjs .yarn/install-state.gz
          rm -rf node_modules
          yarn install --immutable

      - name: Build PR diff
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"

          git diff "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            -- . \
            ':(exclude)**/dist/**' \
            ':(exclude)**/build/**' \
            ':(exclude)**/coverage/**' \
            ':(exclude)**/node_modules/**' \
            ':(exclude)**/.yarn/**' \
            ':(exclude)**/.pnp.cjs' \
            ':(exclude)**/.pnp.loader.mjs' \
            ':(exclude)**/package-lock.json' \
            ':(exclude)**/pnpm-lock.yaml' \
            ':(exclude)**/yarn.lock' \
            > pr.diff

      - name: Run AI review
        working-directory: ./frontend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node ../.github/scripts/review-pr.mjs

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            if (!fs.existsSync("frontend/review.md")) {
              core.info("frontend/review.md not found, skipping comment.");
              return;
            }

            const body = fs.readFileSync("frontend/review.md", "utf8");
            const marker = "<!-- ai-pr-review -->";
            const fullBody = `${marker}\n${body}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.data.find(
              comment =>
                comment.user &&
                comment.user.type === "Bot" &&
                comment.body &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: fullBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: fullBody
              });
            }